---
- name: 仅同步 /var/log/huawei_ipv6 到 FTP 服务器（增量上传）
  hosts: all
  become: true
  gather_facts: true

  vars:
    ftp_host: "10.111.6.110"
    ftp_user: "dxedu"
    ftp_base_dir: "upload"
    # 注意：密码已移除，将在 AWX 中通过环境变量或 Vault 注入

  tasks:
    - name: 安装 lftp（如果未安装）
      package:
        name: lftp
        state: present
      ignore_errors: true

    - name: 获取本服务器 IP
      shell: hostname -I | awk '{print $1}'
      register: server_ip
      changed_when: false

    - name: 显示服务器 IP
      debug:
        msg: "本服务器 IP 是 {{ server_ip.stdout }}，上传目标: {{ ftp_base_dir }}/{{ server_ip.stdout }}/huawei_ipv6"

    - name: 检查 /var/log/huawei_ipv6 是否存在
      stat:
        path: "/var/log/huawei_ipv6"
      register: dir_status
      changed_when: false

    - name: 使用 lftp 增量同步 huawei_ipv6 日志目录
      shell: |
        lftp -u {{ ftp_user }},{{ ftp_pass }} {{ ftp_host }} << 'LFTPCMD'
          set mirror:exclude-regex "\.(lock|swp|tmp)$|/.ansible/tmp/";
          mkdir -p {{ ftp_base_dir }}/{{ server_ip.stdout }}/huawei_ipv6;
          lcd /var/log/huawei_ipv6;
          mirror --reverse --continue --verbose --parallel=5 --only-newer \
                 --exclude-glob "*.lock" --exclude-glob ".*.swp" --exclude-glob "*.tmp" \
                 . {{ ftp_base_dir }}/{{ server_ip.stdout }}/huawei_ipv6;
          bye
        LFTPCMD
      when: dir_status.stat.exists == true
      register: sync_result
      ignore_errors: true
      no_log: true  # 【关键修改】隐藏包含密码的完整命令，防止密码泄露到 AWX 日志中
      environment:  # 【关键修改】通过环境变量传递密码，比直接写在命令行更安全
        ftp_pass: "{{ ftp_pass }}"

    - name: 显示同步结果
      debug:
        msg: "{{ sync_result.stdout_lines | default([]) }}"  # 【关键修改】优化输出格式，避免 AWX 日志中显示复杂的对象结构