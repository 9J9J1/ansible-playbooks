---
- name: 使用原生 curl 通过 FTP 上传日志文件
  hosts: all
  become: true
  gather_facts: true

  vars:
    ftp_host: "10.111.6.110"
    ftp_user: "dxedu"
    ftp_pass: "Dxedu@2024"
    ftp_base_dir: "upload"
    local_src_path: "/var/log/huawei_ipv6"
    # 定义上传时间戳格式
    upload_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}"

  tasks:
    - name: 获取本服务器 IP
      command: hostname -I
      register: ip_output
      changed_when: false

    - name: 提取第一个 IP
      set_fact:
        server_ip: "{{ ip_output.stdout.split(' ')[0] }}"

    - name: 检查源目录是否存在
      stat:
        path: "{{ local_src_path }}"
      register: dir_status

    - name: 获取本地目录下的所有文件列表
      find:
        paths: "{{ local_src_path }}"
        recurse: yes
        file_type: file
      register: files_to_upload
      when: dir_status.stat.exists

    - name: 使用 curl 逐个上传文件到 FTP 服务器
      shell: >
        curl -T "{{ item.path }}" 
        -u "{{ ftp_user }}:{{ ftp_pass }}" 
        "ftp://{{ ftp_host }}/{{ ftp_base_dir }}/{{ server_ip }}/huawei_ipv6/{{ upload_timestamp }}_{{ item.path | basename }}"
        --ftp-create-dirs
      loop: "{{ files_to_upload.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: dir_status.stat.exists and files_to_upload.files | length > 0
      register: upload_results

    - name: 显示上传结果摘要
      debug:
        msg: "FTP 上传任务执行完毕，请检查上方 curl 输出是否有报错。"
      when: dir_status.stat.exists