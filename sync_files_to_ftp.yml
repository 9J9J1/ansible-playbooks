---
- name: 同步/var/log/huawei_ipv6 到 FTP 服务器（增量上传）
  hosts: all
  become: true
  gather_facts: true

  vars:
    ftp_host: "10.111.6.110"
    ftp_user: "dxedu"
    ftp_pass: "Dxedu@2024"
    ftp_base_dir: "upload"

    local_dirs:
      - "/var/log/huawei_ipv6"

  tasks:

    - name: 安装 lftp（如果未安装）
      package:
        name: lftp
        state: present
      ignore_errors: true

    - name: 获取本服务器 IP
      shell: hostname -I | awk '{print $1}'
      register: server_ip
      changed_when: false

    - name: 显示服务器 IP
      debug:
        msg: "本服务器 IP 是 {{ server_ip.stdout }}，上传目标: {{ ftp_base_dir }}/{{ server_ip.stdout }}"

    - name: 检查目录是否存在
      stat:
        path: "{{ item }}"
      register: dir_status
      loop: "{{ local_dirs }}"
      changed_when: false

    - name: 使用 lftp 增量同步目录（仅上传新增/修改的文件）
      command: >
        lftp -u {{ ftp_user }},{{ ftp_pass }} {{ ftp_host }} -e "
          mkdir -p {{ ftp_base_dir }}/{{ server_ip.stdout }}/{{ item.item | basename }};
          lcd {{ item.item }};
          mirror --reverse --continue --verbose --parallel=5 --only-newer
                 {{ item.item | basename }} {{ ftp_base_dir }}/{{ server_ip.stdout }}/{{ item.item | basename }};
          bye"
      loop: "{{ dir_status.results }}"
      when: item.stat.exists == true
      register: sync_result

    - name: 显示同步结果
      debug:
        var: sync_result.results | default([]) | map(attribute='stdout_lines') | list