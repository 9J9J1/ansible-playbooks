---
- name: 仅同步 /var/log/huawei_ipv6 到 FTP 服务器
  hosts: all
  become: true
  gather_facts: true

  vars:
    ftp_host: "10.111.6.110"
    ftp_user: "dxedu"
    ftp_base_dir: "upload"
    # 注意：请在 AWX 的 Extra Variables 中传入 ftp_pass

  tasks:
    - name: 安装 lftp
      package:
        name: lftp
        state: present
      ignore_errors: true

    - name: 获取本服务器 IP
      command: hostname -I
      register: ip_output
      changed_when: false

    - name: 提取第一个 IP
      set_fact:
        server_ip: "{{ ip_output.stdout.split(' ')[0] }}"

    - name: 检查源目录是否存在
      stat:
        path: /var/log/huawei_ipv6
      register: dir_status

    - name: 调试 - 显示将要同步的信息
      debug:
        msg: "准备将 /var/log/huawei_ipv6 同步到 {{ ftp_base_dir }}/{{ server_ip }}/huawei_ipv6"
      when: dir_status.stat.exists

    - name: 执行 lftp 增量同步
      command: >
        lftp -u {{ ftp_user }},{{ ftp_pass }} {{ ftp_host }} -e
        "set debug 3;
         mkdir -p {{ ftp_base_dir }}/{{ server_ip }}/huawei_ipv6;
         mirror --reverse --continue --verbose --parallel=5 --only-newer
         --exclude *.lock --exclude .*.swp --exclude *.tmp
         /var/log/huawei_ipv6 {{ ftp_base_dir }}/{{ server_ip }}/huawei_ipv6;
         bye;"
      when: dir_status.stat.exists
      register: sync_result
      # 调试期间请保持以下两行被注释，以便查看报错
      # ignore_errors: true
      # no_log: true

    - name: 显示同步结果
      debug:
        msg: "{{ sync_result.stdout_lines | default(['没有捕获到输出']) }}"
      when: dir_status.stat.exists