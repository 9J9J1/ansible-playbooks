    - name: 使用 lftp 增量同步 huawei_ipv6 日志目录
      shell: |
        # 1. 调试：检查本地目录是否存在及权限
        echo "=== 开始同步任务 ==="
        echo "当前用户: $(whoami)"
        echo "本地目录内容:"
        ls -la /var/log/huawei_ipv6/ || echo "目录为空或无法访问"

        # 2. 执行 lftp 同步
        lftp -u "{{ ftp_user }}", "{{ ftp_pass }}" "{{ ftp_host }}" << EOF
          # lftp 设置
          set debug 3;
          set mirror:verbose 3;
          set net:timeout 30;
          set net:reconnect-interval-base 5;

          # 远程操作指令
          # 尝试创建父目录（如果不存在）
          mkdir -p "{{ ftp_base_dir }}/{{ server_ip.stdout }}/huawei_ipv6"

          # 切换本地目录
          lcd /var/log/huawei_ipv6

          # 执行增量镜像上传
          # --reverse: 上传
          # --only-newer: 仅上传更新的文件（基于时间/大小）
          # --parallel=5: 并发5个连接
          mirror --reverse --continue --verbose --parallel=5 --only-newer \
                 --exclude "*.lock" --exclude ".*.swp" --exclude "*.tmp" \
                 . "{{ ftp_base_dir }}/{{ server_ip.stdout }}/huawei_ipv6"

          # 退出
          bye
        EOF
      when: dir_status.stat.exists == true
      register: sync_result
      # 注意：为了调试，请暂时注释掉 no_log 和 ignore_errors
      # no_log: false
      # ignore_errors: false