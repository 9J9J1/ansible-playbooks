---
- name: 增量上传 huawei_ipv6 日志目录到 FTP
  hosts: all
  become: true
  gather_facts: true

  vars:
    ftp_host: "10.111.6.110"
    ftp_user: "dxedu"
    ftp_pass: "Dxedu@2024"
    ftp_base_dir: "upload"
    local_src_path: "/var/log/huawei_ipv6"

  tasks:
    - name: 获取本服务器 IP
      command: hostname -I
      register: ip_output
      changed_when: false

    - name: 提取第一个 IP
      set_fact:
        server_ip: "{{ ip_output.stdout.split(' ')[0] }}"

    - name: 检查源目录是否存在
      stat:
        path: "{{ local_src_path }}"
      register: dir_status

    - name: 获取本地目录下的所有文件列表
      find:
        paths: "{{ local_src_path }}"
        recurse: yes
        file_type: file
      register: files_to_upload
      when: dir_status.stat.exists

    - name: 逐个上传文件到 FTP 服务器
      ansible.builtin.uri:
        url: "ftp://{{ ftp_user }}:{{ ftp_pass }}@{{ ftp_host }}/{{ ftp_base_dir }}/{{ server_ip }}/huawei_ipv6/{{ item.path | basename }}"
        method: PUT
        src: "{{ item.path }}"
        force_basic_auth: yes
        status_code: [200, 201, 226, 250]  # FTP 上传成功的常见状态码
      loop: "{{ files_to_upload.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: dir_status.stat.exists and files_to_upload.files | length > 0
      register: upload_results

    - name: 显示上传结果摘要
      debug:
        msg: "成功上传 {{ upload_results.results | selectattr('status_code', 'in', [200, 201, 226, 250]) | list | length }} 个文件"
      when: dir_status.stat.exists